spring.application.name=av02-login
server.port=8080

# Banco de dados H2 (em memória)
spring.datasource.url=jdbc:h2:mem:segurancadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# As tabelas são criadas pelo schema.sql (e populadas pelo data.sql), e não pelo Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Regra de bloqueio: "caso o usuário falhe mais de uma vez no login ele deve ser bloqueado"
# -> na 2a falha consecutiva o usuário é bloqueado
login.tentativas-para-bloqueio=2

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

management.info.java.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# Documentação OpenAPI / Swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# as respostas de cada endpoint já estão documentadas com @ApiResponses
springdoc.override-with-generic-response=false
